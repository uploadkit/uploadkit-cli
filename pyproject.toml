[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "uploadkit-cli"
version = "0.1.0"
description = "Developer CLI for UploadKit validation, inspection, and simulation"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "UploadKit" }]
keywords = ["uploadkit", "cli", "validation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "uploadkit>=0.2.0",
    "uploadkit-security>=0.2.0",
    "uploadkit-testing>=0.1.0",
    "click>=8.1",
]

[project.optional-dependencies]
pdf = ["uploadkit-pdf>=0.1.0"]
office = ["uploadkit-office>=0.1.0"]
audio = ["uploadkit-audio>=0.1.0"]
all = [
    "uploadkit-pdf>=0.1.0",
    "uploadkit-office>=0.1.0",
    "uploadkit-audio>=0.1.0",
]
dev = [
    "pytest>=8.0",
    "coverage>=7.0",
    "uploadkit-pdf>=0.1.0",
    "uploadkit-office>=0.1.0",
    "uploadkit-audio>=0.1.0",
]

[project.scripts]
uploadkit = "uploadkit_cli:main"

[project.urls]
Homepage = "https://github.com/uploadkit/uploadkit-cli"
Repository = "https://github.com/uploadkit/uploadkit-cli"

[tool.hatch.build.targets.wheel]
packages = ["src/uploadkit_cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
